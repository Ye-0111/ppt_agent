[project]
name = "multi-agent-ppt-creator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==43.0.3",
    "databases[mysql]==0.9.0",
    "redis==5.2.0",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langgraph>=0.4.0",
    "python-pptx>=0.6.23",
    "matplotlib>=3.8.0",
    "httpx>=0.27.0",
    "tavily-python>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["app"]
